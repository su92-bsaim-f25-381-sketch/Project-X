<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project X - Trading Bot Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { background: #1e293b; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        .metric-title { font-size: 0.9rem; color: #94a3b8; margin-bottom: 5px; }
        .metric-value { font-size: 1.8rem; font-weight: bold; color: #f8fafc; }
        .btn { border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1rem; transition: 0.2s; }
        .btn-start { background-color: #22c55e; color: #fff; }
        .btn-start:hover { background-color: #16a34a; }
        .btn-stop { background-color: #ef4444; color: #fff; }
        .btn-stop:hover { background-color: #dc2626; }
        .btn-update { background-color: #0ea5e9; color: #fff; margin-top: 10px; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { background-color: #0f172a; color: #94a3b8; }
        .status-win { color: #4ade80; font-weight: bold; }
        .status-loss { color: #f87171; font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
        .badge-active { background: #166534; color: #4ade80; }
        .badge-paused { background: #991b1b; color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Project X - Trading Bot Dashboard</h1>

        <!-- Settings & Status Controls -->
        <div class="grid">
            <div class="card">
                <h3>⚙️ Account Balance</h3>
                <label class="metric-title">Customize Balance ($)</label>
                <input type="number" id="balanceInput" value="1000">
                <button class="btn btn-update" onclick="updateSettings()">Update Balance</button>
            </div>
            <div class="card">
                <h3>🛡️ Risk Control</h3>
                <label class="metric-title">Risk Per Trade (%)</label>
                <input type="number" id="riskInput" value="2.0" step="0.5">
                <button class="btn btn-update" onclick="updateSettings()">Update Risk</button>
            </div>
            <div class="card">
                <h3>⚡ Bot Control</h3>
                <p>Status: <span id="statusBadge" class="badge badge-paused">PAUSED</span></p>
                <button id="toggleBtn" class="btn btn-start" onclick="toggleBot()">🟢 START BOT</button>
            </div>
        </div>

        <!-- Metric Analytics Cards -->
        <div class="grid">
            <div class="card"><div class="metric-title">Balance</div><div class="metric-value" id="dispBalance">$1000.00</div></div>
            <div class="card"><div class="metric-title">Total Trades</div><div class="metric-value" id="dispTotal">0</div></div>
            <div class="card"><div class="metric-title">Wins 🟢</div><div class="metric-value" id="dispWins">0</div></div>
            <div class="card"><div class="metric-title">Losses 🔴</div><div class="metric-value" id="dispLosses">0</div></div>
            <div class="card"><div class="metric-title">Win Rate</div><div class="metric-value" id="dispWinRate">0.00%</div></div>
        </div>

        <!-- Live History Table -->
        <div class="card">
            <h3>📜 Trade History Logs</h3>
            <table>
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Lot Size</th>
                        <th>PnL ($)</th>
                        <th>Status</th>
                        <th>Account Balance</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <tr><td colspan="5" style="text-align:center;">No trades executed yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            const res = await fetch('/api/status');
            const data = await res.json();
            
            document.getElementById('dispBalance').innerText = '$' + data.balance.toFixed(2);
            document.getElementById('dispTotal').innerText = data.total_trades;
            document.getElementById('dispWins').innerText = data.wins;
            document.getElementById('dispLosses').innerText = data.losses;
            document.getElementById('dispWinRate').innerText = data.win_rate + '%';
            
            const badge = document.getElementById('statusBadge');
            const btn = document.getElementById('toggleBtn');
            if(data.is_active) {
                badge.className = 'badge badge-active';
                badge.innerText = 'RUNNING';
                btn.className = 'btn btn-stop';
                btn.innerText = '🔴 STOP BOT';
            } else {
                badge.className = 'badge badge-paused';
                badge.innerText = 'PAUSED';
                btn.className = 'btn btn-start';
                btn.innerText = '🟢 START BOT';
            }

            // Render Trade History
            const historyBody = document.getElementById('historyBody');
            if(data.trade_history.length > 0) {
                historyBody.innerHTML = data.trade_history.map(t => `
                    <tr>
                        <td><b>${t.type}</b></td>
                        <td>${t.lot_size}</td>
                        <td class="${t.result === 'WIN' ? 'status-win' : 'status-loss'}">${t.pnl > 0 ? '+' : ''}${t.pnl}</td>
                        <td class="${t.result === 'WIN' ? 'status-win' : 'status-loss'}">${t.result}</td>
                        <td>$${t.balance}</td>
                    </tr>
                `).join('');
            }
        }

        async function toggleBot() {
            await fetch('/api/toggle', { method: 'POST' });
            fetchStatus();
        }

        async function updateSettings() {
            const balance = document.getElementById('balanceInput').value;
            const risk_percentage = document.getElementById('riskInput').value;
            await fetch('/api/update_settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ balance, risk_percentage })
            });
            fetchStatus();
        }

        // Live Market Tick Interval (Runs market check every 3 seconds)
        setInterval(async () => {
            const res = await fetch('/api/status');
            const data = await res.json();
            if(data.is_active) {
                await fetch('/api/tick', { method: 'POST' });
                fetchStatus();
            }
        }, 3000);

        fetchStatus();
    </script>
</body>
</html>
