<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project X - Live Market</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #070b12;
            color: white;
        }

        header {
            padding: 20px;
            background: #0d121b;
            border-bottom: 1px solid #263246;
        }

        h1 {
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 16px;
        }

        .card {
            background: #111824;
            border: 1px solid #263246;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            margin-top: 8px;
        }

        .live {
            color: #00e676;
            font-weight: bold;
        }

        .chart {
            width: 100%;
            height: 420px;
            background: #080d15;
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #1d5f91;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #287bb8;
        }

        .status {
            margin-top: 10px;
            color: #9ba8ba;
        }

    </style>

</head>


<body>


    <header>

        <h1>
            PROJECT X
        </h1>

        <p>
            Professional Trading Dashboard
        </p>

    </header>


    <main class="container">


        <div class="card">

            <h2>
                ₿ BTC / USDT
            </h2>

            <div
                id="connection"
                class="live"
            >
                ● CONNECTING...
            </div>

            <div
                id="price"
                class="price"
            >
                Loading...
            </div>

        </div>


        <div class="card">

            <h2>
                📈 Live BTC Chart
            </h2>

            <div class="chart">

                <canvas
                    id="chartCanvas"
                ></canvas>

            </div>

        </div>


        <div class="card">

            <h2>
                🤖 Project X Bot
            </h2>

            <p>
                Bot Status:
                <span
                    id="botStatus"
                    class="live"
                >
                    OFF
                </span>
            </p>

            <button
                onclick="toggleBot()"
            >
                ON / OFF BOT
            </button>

            <div
                id="analysis"
                class="status"
            >
                Bot is currently OFF.
            </div>

        </div>


    </main>


    <script>


        let socket;

        let botOn = false;

        let currentPrice = 0;

        let prices = [];


        const priceElement =
            document.getElementById(
                "price"
            );


        const connectionElement =
            document.getElementById(
                "connection"
            );


        const canvas =
            document.getElementById(
                "chartCanvas"
            );


        const ctx =
            canvas.getContext("2d");


        function connectBinance() {


            socket =
                new WebSocket(
                    "wss://stream.binance.com:9443/ws/btcusdt@trade"
                );


            socket.onopen =
                function () {

                    connectionElement.textContent =
                        "● BINANCE LIVE";

                };


            socket.onmessage =
                function (event) {


                    const data =
                        JSON.parse(
                            event.data
                        );


                    currentPrice =
                        Number(data.p);


                    priceElement.textContent =
                        "$" +
                        currentPrice.toFixed(2);


                    prices.push(
                        currentPrice
                    );


                    if (
                        prices.length > 100
                    ) {

                        prices.shift();

                    }


                    drawChart();


                    if (botOn) {

                        analyseMarket();

                    }

                };


            socket.onerror =
                function () {

                    connectionElement.textContent =
                        "● CONNECTION ERROR";

                };


            socket.onclose =
                function () {

                    connectionElement.textContent =
                        "● DISCONNECTED";

                };

        }


        function drawChart() {


            const parent =
                canvas.parentElement;


            canvas.width =
                parent.clientWidth;


            canvas.height =
                parent.clientHeight;


            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            if (
                prices.length < 2
            ) {

                return;

            }


            const min =
                Math.min(...prices);


            const max =
                Math.max(...prices);


            const range =
                max - min || 1;


            ctx.beginPath();


            prices.forEach(
                function (
                    value,
                    index
                ) {


                    const x =
                        index *
                        (
                            canvas.width /
                            (prices.length - 1)
                        );


                    const y =
                        canvas.height -
                        (
                            (
                                (value - min) /
                                range
                            ) *
                            (
                                canvas.height - 30
                            )
                        ) -
                        15;


                    if (index === 0) {

                        ctx.moveTo(
                            x,
                            y
                        );

                    } else {

                        ctx.lineTo(
                            x,
                            y
                        );

                    }

                }
            );


            ctx.strokeStyle =
                "#4da3ff";


            ctx.lineWidth = 2;


            ctx.stroke();

        }


        function toggleBot() {


            botOn = !botOn;


            const status =
                document.getElementById(
                    "botStatus"
                );


            const analysis =
                document.getElementById(
                    "analysis"
                );


            if (botOn) {


                status.textContent =
                    "ON";


                analysis.textContent =
                    "Project X is monitoring BTC/USDT live market data.";

            } else {


                status.textContent =
                    "OFF";


                analysis.textContent =
                    "Bot is currently OFF.";

            }

        }


        function analyseMarket() {


            if (
                prices.length < 20
            ) {

                return;

            }


            const oldPrice =
                prices[
                    prices.length - 20
                ];


            const movement =
                (
                    (
                        currentPrice -
                        oldPrice
                    ) /
                    oldPrice
                ) * 100;


            let signal =
                "WAIT";


            if (
                movement > 0.20
            ) {

                signal =
                    "BUY WATCH";

            }


            if (
                movement < -0.20
            ) {

                signal =
                    "SELL WATCH";

            }


            document.getElementById(
                "analysis"
            ).textContent =
                "BTC/USDT movement: " +
                movement.toFixed(3) +
                "% • Signal: " +
                signal;

        }


        window.addEventListener(
            "resize",
            drawChart
        );


        connectBinance();


    </script>


</body>

</html>
