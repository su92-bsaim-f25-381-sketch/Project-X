<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project X</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #070b12;
            color: white;
        }

        header {
            padding: 20px;
            background: #0d121b;
            border-bottom: 1px solid #263246;
        }

        h1 {
            margin: 0;
        }

        .container {
            padding: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: #111824;
            border: 1px solid #263246;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #1d5f91;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #287bb8;
        }

        .status {
            color: #00e676;
            font-weight: bold;
        }

    </style>

</head>


<body>


    <header>

        <h1>
            PROJECT X
        </h1>

        <p>
            Professional Trading Dashboard
        </p>

    </header>


    <main class="container">


        <div class="card">

            <h2>
                🤖 Bot
            </h2>

            <p>
                Bot Status:
                <span
                    id="status"
                    class="status"
                >
                    OFF
                </span>
            </p>

            <button
                onclick="toggleBot()"
            >
                ON / OFF BOT
            </button>

        </div>


        <div class="card">

            <h2>
                💰 Trading Balance
            </h2>

            <p>
                Balance:
                $<span id="balance">
                    10000
                </span>
            </p>

            <input
                id="balanceInput"
                type="number"
                value="10000"
            >

            <br><br>

            <button
                onclick="changeBalance()"
            >
                APPLY BALANCE
            </button>

        </div>


        <div class="card">

            <h2>
                📊 Market
            </h2>

            <p>
                BTC/USD
            </p>

            <p>
                Live market dashboard ready.
            </p>

        </div>


    </main>


    <script>


        let botOn = false;


        function toggleBot() {

            botOn = !botOn;


            const status =
                document.getElementById("status");


            if (botOn) {

                status.textContent = "ON";

            } else {

                status.textContent = "OFF";

            }

        }


        function changeBalance() {

            const input =
                document.getElementById(
                    "balanceInput"
                );


            const balance =
                Number(input.value);


            if (balance <= 0) {

                alert(
                    "Please enter a valid balance."
                );

                return;

            }


            document.getElementById(
                "balance"
            ).textContent =
                balance.toFixed(2);

        }


    </script>


</body>

</html>
